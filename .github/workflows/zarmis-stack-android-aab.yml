name: Zarmis Stack Android AAB

# Build signed AAB and upload to Google Play (Internal by default).
# Signing: credentials.json + credentials/android/keystore.jks in repo.
# Play upload: GOOGLE_PLAY_SERVICE_ACCOUNT_JSON secret required.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      play_track:
        description: 'Google Play track for the AAB'
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal
      play_status:
        description: 'Release status on that track'
        type: choice
        options:
          - draft
          - completed
        default: draft

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-aab:
    name: Build and upload AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      PLAY_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Require Play upload secret
        if: ${{ env.PLAY_JSON == '' }}
        run: |
          echo "::error::Missing secret GOOGLE_PLAY_SERVICE_ACCOUNT_JSON. See doc/ANDROID_AAB.md"
          exit 1

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Accept Android SDK licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Generate android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Guard AdMob not linked while ADS_ENABLED=false
        run: |
          set -euo pipefail
          ADS_ENABLED=$(node -p "require('./brand.config.js').ADS_ENABLED")
          if [ "$ADS_ENABLED" = "false" ] || [ "$ADS_ENABLED" = "0" ]; then
            if grep -RInE 'react-native-google-mobile-ads|MobileAdsInitProvider|com\.google\.android\.gms\.ads\.APPLICATION_ID' \
                android/settings.gradle android/app/build.gradle android/app/src/main/AndroidManifest.xml \
                android 2>/dev/null | head -20; then
              echo "::error::AdMob native bits found while brand.config.js ADS_ENABLED=false."
              exit 1
            fi
            if [ -d node_modules/react-native-google-mobile-ads ]; then
              echo "::error::react-native-google-mobile-ads is installed but ADS_ENABLED=false. Uninstall until ads are ready."
              exit 1
            fi
            echo "OK — AdMob not linked (ADS_ENABLED=false)"
          else
            echo "ADS_ENABLED=true — AdMob expected"
          fi

      - name: Tune Gradle for CI
        run: |
          {
            echo ""
            echo "org.gradle.jvmargs=-Xmx6144m -XX:MaxMetaspaceSize=1024m -XX:+UseParallelGC"
            echo "org.gradle.workers.max=4"
            echo "org.gradle.caching=true"
            echo "org.gradle.parallel=true"
            echo "reactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64"
            echo "android.enableMinifyInReleaseBuilds=true"
            echo "android.enableShrinkResourcesInReleaseBuilds=true"
          } >> android/gradle.properties

      - name: Ensure R8 minify (mapping.txt for Play)
        run: |
          set -euo pipefail
          APP_GRADLE="android/app/build.gradle"
          if [ -f "$APP_GRADLE" ] && ! grep -q 'enableMinifyInReleaseBuilds' "$APP_GRADLE"; then
            python3 - <<'PY'
          from pathlib import Path
          path = Path("android/app/build.gradle")
          text = path.read_text()
          needle = "release {"
          if needle in text and "minifyEnabled" not in text.split("release {", 1)[1].split("}", 1)[0]:
              text = text.replace(
                  "release {",
                  "release {\n            minifyEnabled true\n            shrinkResources true\n            proguardFiles getDefaultProguardFile(\"proguard-android-optimize.txt\"), \"proguard-rules.pro\"",
                  1,
              )
              path.write_text(text)
              print("Patched minifyEnabled into android/app/build.gradle")
          else:
              print("build.gradle already has minify or unexpected shape; leaving as-is")
          PY
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Get version info
        id: version
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          VERSION_CODE=$(node -p "require('./app.json').expo.android.versionCode")
          PACKAGE=$(node -p "require('./brand.config.js').ANDROID_PACKAGE")
          SLUG=$(node -p "require('./brand.config.js').APP_SLUG")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "package=$PACKAGE" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "aab_name=${SLUG}-v${VERSION}-vc${VERSION_CODE}.aab" >> "$GITHUB_OUTPUT"

      - name: Configure release signing
        run: |
          set -euo pipefail
          if [ ! -f credentials.json ]; then
            echo "Missing credentials.json" >&2
            exit 1
          fi
          mkdir -p android/app
          KEYSTORE_PATH=$(node -p "require('./credentials.json').android.keystore.keystorePath")
          KEYSTORE_PASSWORD=$(node -p "require('./credentials.json').android.keystore.keystorePassword")
          KEY_ALIAS=$(node -p "require('./credentials.json').android.keystore.keyAlias")
          KEY_PASSWORD=$(node -p "require('./credentials.json').android.keystore.keyPassword")
          cp "$KEYSTORE_PATH" android/app/upload-keystore.jks
          {
            echo "KEY_ALIAS<<EOF"
            printf '%s\n' "$KEY_ALIAS"
            echo "EOF"
            echo "KEYSTORE_PASSWORD<<EOF"
            printf '%s\n' "$KEYSTORE_PASSWORD"
            echo "EOF"
            echo "KEY_PASSWORD<<EOF"
            printf '%s\n' "$KEY_PASSWORD"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Build release AAB
        run: |
          cd android
          ./gradlew bundleRelease --no-daemon --build-cache --parallel \
            -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86,x86_64 \
            -Pandroid.injected.signing.store.file="$PWD/app/upload-keystore.jks" \
            -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
            -Pandroid.injected.signing.key.alias="$KEY_ALIAS" \
            -Pandroid.injected.signing.key.password="$KEY_PASSWORD"

      - name: Guard against restricted photo/video read permissions
        run: |
          set -euo pipefail
          if grep -RIn --include='AndroidManifest.xml' \
              -e 'android.permission.READ_MEDIA_IMAGES' \
              -e 'android.permission.READ_MEDIA_VIDEO' \
              android/app 2>/dev/null | grep -v 'tools:node="remove"' ; then
            echo "::error::Restricted READ_MEDIA_* permission found"
            exit 1
          fi
          echo "OK — no active READ_MEDIA_IMAGES / READ_MEDIA_VIDEO"

      - name: Stage AAB (and optional mapping)
        id: stage
        run: |
          set -euo pipefail
          mkdir -p dist
          AAB="dist/${{ steps.version.outputs.aab_name }}"
          cp android/app/build/outputs/bundle/release/app-release.aab "$AAB"
          echo "aab_path=$AAB" >> "$GITHUB_OUTPUT"
          MAP="android/app/build/outputs/mapping/release/mapping.txt"
          if [ -f "$MAP" ]; then
            cp "$MAP" "dist/${{ steps.version.outputs.aab_name }}.mapping.txt"
            echo "mapping_path=dist/${{ steps.version.outputs.aab_name }}.mapping.txt" >> "$GITHUB_OUTPUT"
          else
            echo "mapping_path=" >> "$GITHUB_OUTPUT"
          fi
          ls -lh dist/

      - name: Upload AAB to Google Play
        uses: r0adkll/upload-google-play@v1.1.3
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.version.outputs.package }}
          releaseFiles: ${{ steps.stage.outputs.aab_path }}
          track: ${{ github.event_name == 'workflow_dispatch' && inputs.play_track || 'internal' }}
          status: ${{ github.event_name == 'workflow_dispatch' && inputs.play_status || 'draft' }}
          mappingFile: ${{ steps.stage.outputs.mapping_path != '' && steps.stage.outputs.mapping_path || '' }}
